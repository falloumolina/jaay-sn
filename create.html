<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boutique JAAY</title>
<style>
body { background: #FFF8E1; font-family: Arial; padding: 20px; margin:0; }
.container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
.header { text-align: center; margin-bottom: 20px; }
.header img { max-width: 120px; border-radius: 10px; margin-bottom: 10px; }
h1 { color: #E67E22; margin: 10px 0; }
.paiement { display: flex; gap: 10px; justify-content: center; margin: 15px 0; flex-wrap: wrap; }
.badge { background: #27AE60; color: white; padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }
.produit { border: 2px solid #eee; padding: 15px; border-radius: 10px; margin-bottom: 10px; }
.produit h3 { margin: 0 0 10px 0; color: #333; }
.btn-whatsapp { width: 100%; padding: 15px; background: #25D366; color: white; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; font-weight: bold; }
.btn-whatsapp:hover { background: #20b955; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <img id="logoBoutique" src="" style="display:none;">
    <h1 id="nomBoutique">Ma Boutique</h1>
    <div class="paiement" id="paiementBadges"></div>
  </div>

  <div id="produits"></div>

  <button class="btn-whatsapp" onclick="commander()">Commander sur WhatsApp</button>
</div>

<script>
  // 1. Lire les paramètres de l'URL
  const urlParams = new URLSearchParams(window.location.search);
  const nom = urlParams.get('nom') || 'Ma Boutique';
  const whatsapp = urlParams.get('w') || '';
  const p1 = urlParams.get('p1');
  const p2 = urlParams.get('p2');
  const p3 = urlParams.get('p3');

  document.getElementById('nomBoutique').innerText = nom;

  // 2. Lire les paramètres sauvegardés
  const logo = localStorage.getItem('jaay_logo');
  if(logo){
    document.getElementById('logoBoutique').src = logo;
    document.getElementById('logoBoutique').style.display = 'block';
  }

  // 3. Afficher les méthodes de paiement
  const badges = [];
  if(localStorage.getItem('jaay_payWave') === 'true') badges.push('<span class="badge">Wave</span>');
  if(localStorage.getItem('jaay_payOM') === 'true') badges.push('<span class="badge">Orange Money</span>');
  if(localStorage.getItem('jaay_payCash') === 'true') badges.push('<span class="badge">Cash</span>');
  document.getElementById('paiementBadges').innerHTML = badges.join('');

  // 4. Afficher les produits
  let produitsHTML = '';
  [p1,p2,p3].forEach(p => {
    if(p) produitsHTML += `<div class="produit"><h3>${p}</h3></div>`;
  });
  document.getElementById('produits').innerHTML = produitsHTML;

  // 5. Bouton WhatsApp avec message auto
  function commander(){
    let msg = localStorage.getItem('jaay_msgAuto') || 'Bonjour, je veux commander';
    let listeProduits = [p1,p2,p3].filter(Boolean).join(', ');
    msg = msg.replace('{produit}', listeProduits).replace('{prix}', 'sur demande');
    
    const lienWA = `https://wa.me/${whatsapp}?text=${encodeURIComponent(msg)}`;
    window.open(lienWA, '_blank');
  }
</script>
</body>
  </html>
