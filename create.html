<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Créer ma boutique - JAAY</title>
  <style>
    :root{
      --bg: #FFF8E1;
      --card: #FFFFFF;
      --text: #2C3E50;
      --border: #ddd;
      --orange: #E67E22;
      --vert: #27AE60;
    }
    body.dark{
      --bg: #121212;
      --card: #1E1E1E;
      --text: #EAEAEA;
      --border: #444;
    }
    *{ transition: background 0.3s, color 0.3s, border 0.3s; box-sizing: border-box; }
    body { background: var(--bg); font-family: Arial; padding: 20px; color: var(--text); margin: 0; }
    .container { max-width: 600px; margin: 0 auto; background: var(--card); padding: 30px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border: 1px solid var(--border); }
    h1 { color: var(--orange); text-align: center; margin-bottom: 15px; }
    .menu { display: flex; gap: 10px; margin-bottom: 25px; justify-content: center; }
    .menu a { text-decoration: none; color: var(--vert); font-weight: bold; padding: 8px 15px; border: 2px solid var(--vert); border-radius: 8px; font-size: 14px; }
    .menu a.active { background: var(--vert); color: white; }
    label { font-weight: bold; margin-top: 10px; display: block; }
    input { width: 100%; padding: 12px; margin: 5px 0 15px 0; border: 2px solid var(--border); border-radius: 8px; font-size: 16px; box-sizing: border-box; background: var(--bg); color: var(--text); }
    input::placeholder { color: #999; }
    body.dark input::placeholder { color: #777; }
    button { width: 100%; padding: 15px; background: var(--vert); color: white; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; font-weight: bold; }
    button:hover { background: #219A52; }
    #result { margin-top:20px; text-align: center; }
    #result a { color:var(--vert); font-weight: bold; font-size: 18px; }
  </style>
</head>
<body>
  <div class="container">
    
    <div style="display: flex; align-items: center; gap: 10px; justify-content: center; margin-bottom: 15px;">
      <button onclick="window.history.back()" style="background: var(--orange); color: white; border: none; border-radius: 50%; width: 40px; height: 40px; font-size: 20px; cursor: pointer; font-weight: bold;">←</button>
      <h1 style="margin: 0;" data-fr="Créer ma boutique JAAY" data-en="Create my JAAY Shop">Créer ma boutique JAAY</h1>
    </div>

    <div class="menu">
      <a href="create.html" class="active" data-fr="Créer" data-en="Create">Créer</a>
      <a href="boutique.html" data-fr="Boutique" data-en="Shop">Boutique</a>
      <a href="parametres.html" data-fr="Paramètres" data-en="Settings">Paramètres</a>
    </div>

    <form id="boutiqueForm">
      <label data-fr="Nom de ta boutique" data-en="Shop Name">Nom de ta boutique</label>
      <input type="text" id="nom" placeholder="Ex: Mode Fatou" required>

      <label data-fr="Numéro WhatsApp avec indicatif" data-en="WhatsApp Number with country code">Numéro WhatsApp avec indicatif</label>
      <input type="tel" id="whatsapp" placeholder="Ex: 221771234567" required>

      <label data-fr="Produit 1" data-en="Product 1">Produit 1</label>
      <input type="text" id="p1" placeholder="Ex: Robe Wax - 15000 FCFA">

      <label data-fr="Produit 2" data-en="Product 2">Produit 2</label>
      <input type="text" id="p2" placeholder="Ex: Shoes - 10000 FCFA">

      <label data-fr="Produit 3" data-en="Product 3">Produit 3</label>
      <input type="text" id="p3" placeholder="Ex: Bag - 8000 FCFA">

      <button type="submit" data-fr="Générer ma boutique" data-en="Generate my Shop">Générer ma boutique</button>
    </form>
    <div id="result"></div>
  </div>

  <script>
    // FONCTION POUR DETECTER LA LANGUE
    function detectLang(text) {
      if(!text) return 'fr';
      const frWords = ['de', 'la', 'le', 'et', 'à', 'robe', 'chaussure', 'sac', 'franc', 'fcfa'];
      const enWords = ['the', 'and', 'shoes', 'bag', 'dress', 'dollar', 'usd'];
      text = text.toLowerCase();
      if(enWords.some(word => text.includes(word))) return 'en';
      if(frWords.some(word => text.includes(word))) return 'fr';
      return 'fr'; // par défaut français
    }

    function setLanguage(lang) {
      document.documentElement.lang = lang;
      document.querySelectorAll('[data-fr]').forEach(el => {
        el.innerText = el.getAttribute('data-' + lang);
      });
      // Changer aussi les placeholders
      if(lang === 'en'){
        document.getElementById('nom').placeholder = "Ex: Fatou Fashion";
        document.getElementById('whatsapp').placeholder = "Ex: 221771234567";
        document.getElementById('p1').placeholder = "Ex: Wax Dress - 15000 FCFA";
        document.getElementById('p2').placeholder = "Ex: Shoes - 10000 FCFA";
        document.getElementById('p3').placeholder = "Ex: Bag - 8000 FCFA";
      } else {
        document.getElementById('nom').placeholder = "Ex: Mode Fatou";
        document.getElementById('whatsapp').placeholder = "Ex: 221771234567";
        document.getElementById('p1').placeholder = "Ex: Robe Wax - 15000 FCFA";
        document.getElementById('p2').placeholder = "Ex: Chaussures - 10000 FCFA";
        document.getElementById('p3').placeholder = "Ex: Sac - 8000 FCFA";
      }
    }

    // CHARGER LE THEME AU DEMARRAGE
    window.addEventListener('DOMContentLoaded', () => {
      const savedTheme = localStorage.getItem('jaay_theme');
      if(savedTheme === 'dark'){
        document.body.classList.add('dark');
      }
      const savedLang = localStorage.getItem('jaay_lang') || 'fr';
      setLanguage(savedLang);
    });

    document.getElementById('nom').value = localStorage.getItem('nomBoutique') || '';
    document.getElementById('whatsapp').value = localStorage.getItem('numeroWhatsapp') || '';

    // Detecter la langue quand il tape
    document.getElementById('nom').addEventListener('input', (e) => {
      const lang = detectLang(e.target.value);
      setLanguage(lang);
      localStorage.setItem('jaay_lang', lang);
    });

    document.getElementById('boutiqueForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const nom = document.getElementById('nom').value;
      const whatsapp = document.getElementById('whatsapp').value.replace(/\D/g,'');
      const p1 = document.getElementById('p1').value;
      const p2 = document.getElementById('p2').value;
      const p3 = document.getElementById('p3').value;

      localStorage.setItem('nomBoutique', nom);
      localStorage.setItem('numeroWhatsapp', whatsapp);

      const lien = `boutique.html?nom=${encodeURIComponent(nom)}&w=${whatsapp}&p1=${encodeURIComponent(p1)}&p2=${encodeURIComponent(p2)}&p3=${encodeURIComponent(p3)}`;

      const lang = localStorage.getItem('jaay_lang') || 'fr';
      const msgSuccess = lang === 'en' ? '✅ Your shop is ready!' : '✅ Ta boutique est prête!';
      const msgVoir = lang === 'en' ? '👉 View my shop' : '👉 Voir ma boutique';

      document.getElementById('result').innerHTML =
        `<p>${msgSuccess}</p>
         <a href="${lien}" target="_blank">${msgVoir}</a>`;
    });
  </script>
</body>
  </html>
