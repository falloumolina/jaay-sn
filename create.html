<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paramètres - JAAY</title>
  <style>
    :root{--bg: #FFF8E1; --card: #FFFFFF; --text: #2C3E50; --border: #ddd; --orange: #E67E22; --vert: #27AE60;}
    body.dark{--bg: #121212; --card: #1E1E1E; --text: #EAEAEA; --border: #444;}
    *{ transition: background 0.3s, color 0.3s, border 0.3s; box-sizing: border-box; }
    body { background: var(--bg); font-family: Arial; padding: 20px; color: var(--text); margin: 0; }
  .container { max-width: 600px; margin: 0 auto; background: var(--card); padding: 30px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border: 1px solid var(--border); }
  .top-bar { background: var(--orange); padding: 15px; border-radius: 10px; display: flex; align-items: center; gap: 10px; margin-bottom: 20px; color: white; }
  .top-bar h1 { margin: 0; flex: 1; text-align: center; font-size: 20px; }
  .menu { display: flex; gap: 10px; margin-bottom: 25px; justify-content: center; }
  .menu a { text-decoration: none; color: var(--vert); font-weight: bold; padding: 8px 15px; border: 2px solid var(--vert); border-radius: 8px; font-size: 14px; }
  .menu a.active { background: var(--vert); color: white; }
  .box { background: var(--bg); padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px solid var(--border); }
  .box label { color: var(--orange); font-weight: bold; display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    select { width: 100%; padding: 12px; border: 2px solid var(--border); border-radius: 8px; font-size: 16px; background: var(--card); color: var(--text); }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <button onclick="window.history.back()" style="background: white; color: var(--orange); border: none; border-radius: 50%; width: 40px; height: 40px; font-size: 20px; cursor: pointer; font-weight: bold;">←</button>
      <h1 id="titre_param">Paramètres JAAY</h1>
    </div>

    <div class="menu">
      <a href="create.html" id="menu1">Créer</a>
      <a href="boutique.html" id="menu2">Boutique</a>
      <a href="parametres.html" class="active" id="menu3">Paramètres</a>
    </div>

    <!-- VOICI LE SELECT LANGUE -->
    <div class="box">
      <label id="label_langue">🌍 Langue</label>
      <select id="selectLangue" onchange="changerLangue(this.value)">
        <option value="fr">🇫🇷 Français</option>
        <option value="en">🇺🇸 English</option>
        <option value="wo">🇸🇳 Wolof</option>
      </select>
    </div>

    <div class="box">
      <label>💰 Devise</label>
      <select id="devise">
        <option value="XOF">Franc CFA - XOF</option>
        <option value="USD">Dollar - USD</option>
        <option value="EUR">Euro - EUR</option>
      </select>
    </div>

    <div class="box">
      <label>🔒 Politique de Confidentialité</label>
      <select><option>Lire la politique complète</option></select>
    </div>

    <div class="box">
      <label>📄 Conditions Générales de Vente</label>
      <select><option>Lire les CGV</option></select>
    </div>
  </div>

  <script>
    const translations = {
      fr: {titre: "Paramètres JAAY", menu1: "Créer", menu2: "Boutique", menu3: "Paramètres", label_langue: "🌍 Langue"},
      en: {titre: "JAAY Settings", menu1: "Create", menu2: "Shop", menu3: "Settings", label_langue: "🌍 Language"},
      wo: {titre: "Paramètre yi JAAY", menu1: "Défaral", menu2: "Boutique", menu3: "Paramètre yi", label_langue: "🌍 Làkk"}
    };

    function setLanguage(lang){
      const t = translations[lang];
      document.documentElement.lang = lang;
      document.getElementById('selectLangue').value = lang;
      localStorage.setItem('jaay_lang', lang);
      document.getElementById('titre_param').innerText = t.titre;
      document.getElementById('menu1').innerText = t.menu1;
      document.getElementById('menu2').innerText = t.menu2;
      document.getElementById('menu3').innerText = t.menu3;
      document.getElementById('label_langue').innerText = t.label_langue;
    }

    function changerLangue(lang){ setLanguage(lang); }

    window.addEventListener('DOMContentLoaded', () => {
      const savedTheme = localStorage.getItem('jaay_theme');
      if(savedTheme === 'dark'){ document.body.classList.add('dark'); }
      const savedLang = localStorage.getItem('jaay_lang') || 'fr';
      setLanguage(savedLang);
      document.getElementById('devise').value = localStorage.getItem('jaay_devise') || 'XOF';
    });

    document.getElementById('devise').addEventListener('change', (e) => {
      localStorage.setItem('jaay_devise', e.target.value);
    });
  </script>
</body>
  </html>
