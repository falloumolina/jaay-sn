<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Créer ma boutique - JAAY</title>
  <style>
    :root{
      --bg: #FFF8E1;
      --card: #FFFFFF;
      --text: #2C3E50;
      --border: #ddd;
      --orange: #E67E22;
      --vert: #27AE60;
    }
    body.dark{
      --bg: #121212;
      --card: #1E1E1E;
      --text: #EAEAEA;
      --border: #444;
    }
    *{ transition: background 0.3s, color 0.3s, border 0.3s; }
    body { background: var(--bg); font-family: Arial; padding: 20px; color: var(--text); margin: 0; }
  .container { max-width: 600px; margin: 0 auto; background: var(--card); padding: 30px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border: 1px solid var(--border); }
  .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    h1 { color: var(--orange); text-align: center; margin-bottom: 15px; }
  .menu { display: flex; gap: 10px; margin-bottom: 25px; justify-content: center; }
  .menu a { text-decoration: none; color: var(--vert); font-weight: bold; padding: 8px 15px; border: 2px solid var(--vert); border-radius: 8px; font-size: 14px; }
  .menu a.active { background: var(--vert); color: white; }
    label { font-weight: bold; margin-top: 10px; display: block; }
    input, select { width: 100%; padding: 12px; margin: 5px 0 15px 0; border: 2px solid var(--border); border-radius: 8px; font-size: 16px; box-sizing: border-box; background: var(--bg); color: var(--text); }
    input::placeholder { color: #999; }
    body.dark input::placeholder { color: #777; }
    button { width: 100%; padding: 15px; background: var(--vert); color: white; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; font-weight: bold; }
    button:hover { background: #219A52; }
    #result { margin-top:20px; text-align: center; }
    #result a { color:var(--vert); font-weight: bold; font-size: 18px; }
   .lang-box { margin-bottom: 20px; }
   .lang-box label { color: var(--orange); display: flex; align-items: center; gap: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="top">
      <button onclick="window.history.back()" style="background: var(--orange); color: white; border: none; border-radius: 50%; width: 40px; height: 40px; font-size: 20px; cursor: pointer; font-weight: bold;">←</button>
    </div>

    <h1 id="titre">Créer ma boutique JAAY</h1>

    <div class="menu">
      <a href="create.html" class="active" id="menu1">Créer</a>
      <a href="boutique.html" id="menu2">Boutique</a>
      <a href="parametres.html" id="menu3">Paramètres</a>
    </div>

    <!-- SELECT LANGUE COMME DANS PARAMETRES -->
    <div class="lang-box">
      <label id="label_langue">🌍 Langue</label>
      <select id="selectLangue" onchange="changerLangue(this.value)">
        <option value="fr">🇫🇷 Français</option>
        <option value="en">🇺🇸 English</option>
        <option value="wo">🇸🇳 Wolof</option>
      </select>
    </div>

    <form id="boutiqueForm">
      <label id="label_nom">Nom de ta boutique</label>
      <input type="text" id="nom" placeholder="Ex: Mode Fatou" required>

      <label id="label_whatsapp">Numéro WhatsApp avec indicatif</label>
      <input type="tel" id="whatsapp" placeholder="Ex: 221771234567" required>

      <label id="label_p1">Produit 1</label>
      <input type="text" id="p1" placeholder="Ex: Robe Wax - 15000 FCFA">

      <label id="label_p2">Produit 2</label>
      <input type="text" id="p2" placeholder="Ex: Chaussures - 10000 FCFA">

      <label id="label_p3">Produit 3</label>
      <input type="text" id="p3" placeholder="Ex: Sac - 8000 FCFA">

      <button type="submit" id="btn_submit">Générer ma boutique</button>
    </form>
    <div id="result"></div>
  </div>

  <script>
    const translations = {
      fr: {
        titre: "Créer ma boutique JAAY",
        menu1: "Créer", menu2: "Boutique", menu3: "Paramètres",
        label_langue: "🌍 Langue",
        label_nom: "Nom de ta boutique", label_whatsapp: "Numéro WhatsApp avec indicatif",
        label_p1: "Produit 1", label_p2: "Produit 2", label_p3: "Produit 3",
        btn_submit: "Générer ma boutique",
        ph_nom: "Ex: Mode Fatou", ph_whatsapp: "Ex: 221771234567",
        ph_p1: "Ex: Robe Wax - 15000 FCFA", ph_p2: "Ex: Chaussures - 10000 FCFA", ph_p3: "Ex: Sac - 8000 FCFA",
        success: "✅ Ta boutique est prête!",
        voir: "👉 Voir ma boutique"
      },
      en: {
        titre: "Create my JAAY Shop",
        menu1: "Create", menu2: "Shop", menu3: "Settings",
        label_langue: "🌍 Language",
        label_nom: "Shop Name", label_whatsapp: "WhatsApp Number with country code",
        label_p1: "Product 1", label_p2: "Product 2", label_p3: "Product 3",
        btn_submit: "Generate my Shop",
        ph_nom: "Ex: Fatou Fashion", ph_whatsapp: "Ex: 221771234567",
        ph_p1: "Ex: Wax Dress - 15000 FCFA", ph_p2: "Ex: Shoes - 10000 FCFA", ph_p3: "Ex: Bag - 8000 FCFA",
        success: "✅ Your shop is ready!",
        voir: "👉 View my shop"
      },
      wo: {
        titre: "Défaral Sama Boutique JAAY",
        menu1: "Défaral", menu2: "Boutique", menu3: "Paramètre yi",
        label_langue: "🌍 Làkk",
        label_nom: "Turul sa Boutique", label_whatsapp: "Numéro WhatsApp ak indicatif",
        label_p1: "Jëfandikoo 1", label_p2: "Jëfandikoo 2", label_p3: "Jëfandikoo 3",
        btn_submit: "Défal Sama Boutique",
        ph_nom: "Ex: Mode Fatou", ph_whatsapp: "Ex: 221771234567",
        ph_p1: "Ex: Robe Wax - 15000 FCFA", ph_p2: "Ex: Der yi - 10000 FCFA", ph_p3: "Ex: Sac - 8000 FCFA",
        success: "✅ Sa Boutique bi dafa ready!",
        voir: "👉 Gisal Sama Boutique"
      }
    };

    function setLanguage(lang){
      const t = translations[lang];
      document.documentElement.lang = lang;
      document.getElementById('selectLangue').value = lang;
      localStorage.setItem('jaay_lang', lang);

      document.getElementById('titre').innerText = t.titre;
      document.getElementById('menu1').innerText = t.menu1;
      document.getElementById('menu2').innerText = t.menu2;
      document.getElementById('menu3').innerText = t.menu3;
      document.getElementById('label_langue').innerText = t.label_langue;
      document.getElementById('label_nom').innerText = t.label_nom;
      document.getElementById('label_whatsapp').innerText = t.label_whatsapp;
      document.getElementById('label_p1').innerText = t.label_p1;
      document.getElementById('label_p2').innerText = t.label_p2;
      document.getElementById('label_p3').innerText = t.label_p3;
      document.getElementById('btn_submit').innerText = t.btn_submit;

      document.getElementById('nom').placeholder = t.ph_nom;
      document.getElementById('whatsapp').placeholder = t.ph_whatsapp;
      document.getElementById('p1').placeholder = t.ph_p1;
      document.getElementById('p2').placeholder = t.ph_p2;
      document.getElementById('p3').placeholder = t.ph_p3;
    }

    function changerLangue(lang){
      setLanguage(lang);
    }

    // CHARGER LE THEME ET LA LANGUE AU DEMARRAGE
    window.addEventListener('DOMContentLoaded', () => {
      const savedTheme = localStorage.getItem('jaay_theme');
      if(savedTheme === 'dark'){ document.body.classList.add('dark'); }

      const savedLang = localStorage.getItem('jaay_lang') || 'fr';
      setLanguage(savedLang);
    });

    // Pré-remplir avec les paramètres sauvegardés
    document.getElementById('nom').value = localStorage.getItem('nomBoutique') || '';
    document.getElementById('whatsapp').value = localStorage.getItem('numeroWhatsapp') || '';

    document.getElementById('boutiqueForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const nom = document.getElementById('nom').value;
      const whatsapp = document.getElementById('whatsapp').value.replace(/\D/g,'');
      const p1 = document.getElementById('p1').value;
      const p2 = document.getElementById('p2').value;
      const p3 = document.getElementById('p3').value;

      localStorage.setItem('nomBoutique', nom);
      localStorage.setItem('numeroWhatsapp', whatsapp);

      const lien = `boutique.html?nom=${encodeURIComponent(nom)}&w=${whatsapp}&p1=${encodeURIComponent(p1)}&p2=${encodeURIComponent(p2)}&p3=${encodeURIComponent(p3)}`;
      const lang = localStorage.getItem('jaay_lang') || 'fr';

      document.getElementById('result').innerHTML =
        `<p>${translations[lang].success}</p>
         <a href="${lien}" target="_blank">${translations[lang].voir}</a>`;
    });
  </script>
</body>
        </html>
