<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Créer ma boutique - JAAY</title>
  <style>
    body { background: #FFF8E1; font-family: Arial; padding: 20px; }
    .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 15px; }
    h1 { color: #E67E22; text-align: center; }
    input, textarea { width: 100%; padding: 12px; margin: 10px 0; border: 2px solid #ddd; border-radius: 8px; }
    button { width: 100%; padding: 15px; background: #27AE60; color: white; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; }
    button:hover { background: #219A52; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Créer ma boutique JAAY</h1>
    <form id="boutiqueForm">
      <label>Nom de ta boutique</label>
      <input type="text" id="nom" placeholder="Ex: Mode Fatou" required>

      <label>Numéro WhatsApp</label>
      <input type="tel" id="whatsapp" placeholder="77 123 45 67" required>

      <label>Produit 1</label>
      <input type="text" id="p1" placeholder="Ex: Robe Wax - 15000 FCFA">

      <label>Produit 2</label>
      <input type="text" id="p2" placeholder="Ex: Chaussures - 10000 FCFA">

      <label>Produit 3</label>
      <input type="text" id="p3" placeholder="Ex: Sac - 8000 FCFA">

      <button type="submit">Générer ma boutique</button>
    </form>
    <div id="result" style="margin-top:20px;"></div>
  </div>

  <script>
    document.getElementById('boutiqueForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const nom = document.getElementById('nom').value;
      const lien = `boutique.html?nom=${encodeURIComponent(nom)}`;
      document.getElementById('result').innerHTML = 
        `<p>✅ Ta boutique est prête !</p>
         <a href="${lien}" target="_blank">Voir ma boutique: ${lien}</a>`;
    });
  </script>
</body>
        </html>
