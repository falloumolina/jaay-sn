<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="title">Ma Boutique - JAAY</title>
  <style>
    body { background: #FFF8E1; font-family: Arial; margin: 0; }
    .header { background: #E67E22; color: white; padding: 30px 20px; text-align: center; }
    .header h1 { margin: 0; font-size: 28px; }
    .container { max-width: 600px; margin: 20px auto; padding: 20px; }
    .produit { background: white; padding: 15px; margin: 10px 0; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .whatsapp-btn { display: block; background: #25D366; color: white; text-align: center; padding: 15px; 
                    border-radius: 10px; text-decoration: none; font-size: 18px; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="header">
    <h1 id="nomBoutique">Ma Boutique</h1>
    <p>Commandez directement sur WhatsApp</p>
  </div>

  <div class="container">
    <div class="produit">1. Robe Wax - 15 000 FCFA</div>
    <div class="produit">2. Chaussures - 10 000 FCFA</div>
    <div class="produit">3. Sac - 8 000 FCFA</div>

    <a id="whatsappLink" class="whatsapp-btn" target="_blank">
      📱 Commander sur WhatsApp
    </a>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const nom = urlParams.get('nom') || 'Ma Boutique';
    document.getElementById('nomBoutique').innerText = nom;
    document.getElementById('title').innerText = nom + ' - JAAY';
    
    // Ici on mettra le vrai numéro après
    const numero = '221771234567'; 
    const message = `Salut, je veux commander sur ${nom}`;
    document.getElementById('whatsappLink').href = `https://wa.me/${numero}?text=${encodeURIComponent(message)}`;
  </script>
</body>
  </html>
