<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="title">Ma Boutique - JAAY</title>
  <style>
    :root{
      --bg: #FFF8E1;
      --card: #FFFFFF;
      --text: #2C3E50;
      --orange: #E67E22;
      --vert: #25D366;
    }
    body.dark{
      --bg: #121212;
      --card: #1E1E1E;
      --text: #EAEAEA;
    }
    *{ transition: background 0.3s, color 0.3s; }
    body { background: var(--bg); font-family: Arial; margin: 0; color: var(--text); }
   .header { background: var(--orange); color: white; padding: 30px 20px; text-align: center; }
   .header h1 { margin: 0; font-size: 28px; }
   .container { max-width: 600px; margin: 20px auto; padding: 20px; }
   .produit { background: var(--card); padding: 15px; margin: 10px 0; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); font-size: 16px; border: 1px solid #eee; }
    body.dark.produit { border-color: #333; }
   .whatsapp-btn { display: block; background: var(--vert); color: white; text-align: center; padding: 15px;
                    border-radius: 10px; text-decoration: none; font-size: 18px; margin-top: 20px; font-weight: bold; }
   .footer { text-align: center; padding: 20px; font-size: 12px; color: #777; }
    body.dark.footer { color: #AAA; }
  </style>
</head>
<body>
  <div class="header">
    <h1 id="nomBoutique">Ma Boutique</h1>
    <p>Commandez directement sur WhatsApp</p>
  </div>

  <div class="container">
    <div class="produit">1. Produit 1</div>
    <div class="produit">2. Produit 2</div>
    <div class="produit">3. Produit 3</div>

    <a id="whatsappLink" class="whatsapp-btn" target="_blank">
      📱 Commander sur WhatsApp
    </a>
  </div>

  <div class="footer">Boutique créée avec JAAY.sn</div>

  <script>
    // CHARGER LE THEME AU DEMARRAGE
    window.addEventListener('DOMContentLoaded', () => {
      const savedTheme = localStorage.getItem('jaay_theme');
      if(savedTheme === 'dark'){
        document.body.classList.add('dark');
      }
    });

    const urlParams = new URLSearchParams(window.location.search);
    const nom = urlParams.get('nom') || 'Ma Boutique';
    const whatsapp = urlParams.get('w') || '221771234567';
    const p1 = urlParams.get('p1') || '';
    const p2 = urlParams.get('p2') || '';
    const p3 = urlParams.get('p3') || '';

    document.getElementById('nomBoutique').innerText = nom;
    document.getElementById('title').innerText = nom + ' - JAAY';

    if(p1) document.querySelectorAll('.produit')[0].innerText = '1. ' + p1;
    if(p2) document.querySelectorAll('.produit')[1].innerText = '2. ' + p2;
    if(p3) document.querySelectorAll('.produit')[2].innerText = '3. ' + p3;

    const produits = [p1, p2, p3].filter(p => p!== '').join('\n');
    const message = `Salut ${nom}, je veux commander :\n${produits}\n\nOn discute du paiement et livraison ensemble.\n\nvia JAAY`;
    document.getElementById('whatsappLink').href = `https://wa.me/${whatsapp}?text=${encodeURIComponent(message)}`;
  </script>
</body>
  </html>
