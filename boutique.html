<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="title">Ma Boutique - JAAY</title>
  <style>
    :root{
      --bg: #FFF8E1;
      --card: #FFFFFF;
      --text: #2C3E50;
      --orange: #E67E22;
      --vert: #25D366;
    }
    body.dark{
      --bg: #121212;
      --card: #1E1E1E;
      --text: #EAEAEA;
    }
    *{ transition: background 0.3s, color 0.3s; }
    body { background: var(--bg); font-family: Arial; margin: 0; color: var(--text); }
   .header { background: var(--orange); color: white; padding: 30px 20px; text-align: center; position: relative; }
   .header h1 { margin: 0; font-size: 28px; }
   .back-btn { position: absolute; top: 15px; left: 15px; background: rgba(255,255,255,0.2); border: none; color: white; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-size: 22px; font-weight: bold; }
   .container { max-width: 600px; margin: 20px auto; padding: 20px; }
   .produit { background: var(--card); padding: 15px; margin: 10px 0; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
   .whatsapp-btn { display: block; background: var(--vert); color: white; text-align: center; padding: 15px; border-radius: 10px; text-decoration: none; font-size: 18px; margin-top: 20px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="header">
    <button class="back-btn" onclick="window.history.back()">←</button>
    <h1 id="nomBoutique">Ma Boutique</h1>
    <p>Commandez directement sur WhatsApp</p>
  </div>

  <div class="container">
    <div class="produit">1. Produit 1</div>
    <div class="produit">2. Produit 2</div>
    <div class="produit">3. Produit 3</div>
    <a id="whatsappLink" class="whatsapp-btn" target="_blank">📱 Commander sur WhatsApp</a>
  </div>

  <script>
    // CHARGER LE THEME
    window.addEventListener('DOMContentLoaded', () => {
      const savedTheme = localStorage.getItem('jaay_theme');
      if(savedTheme === 'dark'){ document.body.classList.add('dark'); }
    });

    const urlParams = new URLSearchParams(window.location.search);
    const nom = urlParams.get('nom') || 'Ma Boutique';
    const whatsapp = urlParams.get('w') || '221771234567';
    document.getElementById('nomBoutique').innerText = nom;
    document.getElementById('whatsappLink').href = `https://wa.me/${whatsapp}`;
  </script>
</body>
  </html>
