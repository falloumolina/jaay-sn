<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JAAY - Crée ta boutique en 2 minutes</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', sans-serif; }
    body { background: #FFF8E1; color: #333; }
    .container { max-width: 900px; margin: 0 auto; padding: 20px; }
    
    header { text-align: center; padding: 40px 20px; }
    .logo { font-size: 48px; font-weight: bold; color: #E67E22; }
    .logo span { color: #27AE60; }
    .slogan { font-size: 20px; margin-top: 10px; color: #555; }
    
    .cta { background: #E67E22; color: white; padding: 15px 30px; border-radius: 10px; 
           text-decoration: none; font-size: 18px; display: inline-block; margin-top: 20px; }
    
    .features { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin: 50px 0; }
    .card { background: white; padding: 25px; border-radius: 15px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .icon { font-size: 40px; margin-bottom: 10px; }
    
    footer { text-align: center; padding: 30px; color: #777; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">J<span>AA</span>Y</div>
      <p class="slogan">Crée ta boutique WhatsApp en 2 minutes. Vends partout au Sénégal.</p>
      <a href="#create" class="cta">Créer ma boutique gratuitement</a>
    </header>

    <section class="features">
      <div class="card">
        <div class="icon">⚡</div>
        <h3>Rapide</h3>
        <p>En 2 min ta boutique est prête</p>
      </div>
      <div class="card">
        <div class="icon">📱</div>
        <h3>WhatsApp</h3>
        <p>Les clients commandent direct sur WhatsApp</p>
      </div>
      <div class="card">
        <div class="icon">💰</div>
        <h3>Gratuit</h3>
        <p>Zéro frais. Tu gardes 100% de tes ventes</p>
      </div>
    </section>

    <footer>
      <p>© 2026 JAAY.sn - Fait au Sénégal 🇸🇳</p>
    </footer>
  </div>
</body>
        </html>
