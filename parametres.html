<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paramètres - JAAY</title>
<style>
body { background: #FFF8E1; font-family: Arial; padding: 20px; margin:0; }
.container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
h1 { color: #E67E22; text-align: center; margin-bottom: 15px; }
.menu { display: flex; gap: 10px; margin-bottom: 25px; justify-content: center; }
.menu a { text-decoration: none; color: #27AE60; font-weight: bold; padding: 8px 15px; border: 2px solid #27AE60; border-radius: 8px; font-size: 14px; }
.menu a.active { background: #27AE60; color: white; }
.section { background: #FFF8E1; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
.section h3 { margin-top: 0; color: #E67E22; }
label { display: block; margin: 10px 0 5px; font-weight: bold; }
input, select { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
button { background: #27AE60; color: white; border: none; padding: 15px; border-radius: 8px; font-size: 18px; cursor: pointer; width: 100%; margin-top: 10px; font-weight: bold; }
button:hover { background: #219A52; }
</style>
</head>
<body>
<div class="container">
  <h1>⚙️ Paramètres JAAY</h1>
  
  <div class="menu">
    <a href="create.html">Créer</a>
    <a href="boutique.html">Boutique</a>
    <a href="parametres.html" class="active">Paramètres</a>
  </div>

  <div class="section">
    <h3>Infos Boutique</h3>
    <label>Nom de la boutique</label>
    <input type="text" id="nomBoutique" placeholder="Ex: Mode Fatou">
    
    <label>Numéro WhatsApp</label>
    <input type="tel" id="numeroWhatsapp" placeholder="221771234567">
  </div>

  <button onclick="sauvegarder()">💾 Sauvegarder</button>
  <p id="msg" style="text-align:center; color:green; margin-top:10px;"></p>
</div>

<script>
function sauvegarder(){
  localStorage.setItem('nomBoutique', document.getElementById('nomBoutique').value);
  localStorage.setItem('numeroWhatsapp', document.getElementById('numeroWhatsapp').value);
  document.getElementById('msg').innerText = '✅ Sauvegardé !';
  setTimeout(()=>{document.getElementById('msg').innerText = ''}, 2000);
}
// Charger les valeurs
document.getElementById('nomBoutique').value = localStorage.getItem('nomBoutique') || '';
document.getElementById('numeroWhatsapp').value = localStorage.getItem('numeroWhatsapp') || '';
</script>
</body>
  </html>
