<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paramètres - JAAY</title>
<style>
body { background: #FFF8E1; font-family: Arial; padding: 20px; margin:0; }
.container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
h1 { color: #E67E22; text-align: center; margin-bottom: 15px; font-size: 24px; }
.menu { display: flex; gap: 10px; margin-bottom: 25px; justify-content: center; }
.menu a { text-decoration: none; color: #27AE60; font-weight: bold; padding: 8px 15px; border: 2px solid #27AE60; border-radius: 8px; font-size: 14px; }
.menu a.active { background: #27AE60; color: white; }
.section { background: #FFF8E1; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
.section h3 { margin-top: 0; color: #E67E22; font-size: 16px; }
label { display: block; margin: 10px 0 5px; font-weight: bold; font-size: 14px; }
select, textarea { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
textarea { height: 100px; resize: vertical; }
.checkbox { display: flex; align-items: center; gap: 10px; }
button { background: #27AE60; color: white; border: none; padding: 15px; border-radius: 8px; font-size: 18px; cursor: pointer; width: 100%; margin-top: 10px; font-weight: bold; }
button:hover { background: #219A52; }
.share-btn { background: #E67E22; }
.share-btn:hover { background: #D35400; }
.icon { font-size: 28px; vertical-align: middle; }
small { color: #666; font-size: 12px; }
</style>
</head>
<body>
<div class="container">
  <h1><span class="icon">≡</span> Paramètres JAAY</h1>
  
  <div class="menu">
    <a href="create.html">Créer</a>
    <a href="boutique.html">Boutique</a>
    <a href="parametres.html" class="active">Paramètres</a>
  </div>

  <div class="section">
    <h3>1. Langue</h3>
    <label>Langue d'affichage</label>
    <select id="langue">
      <option value="fr">Français</option>
      <option value="wo">Wolof</option>
      <option value="en">English</option>
    </select>
  </div>

  <div class="section">
    <h3>2. Devise</h3>
    <label>Devise de vente</label>
    <select id="devise">
      <option value="XOF">FCFA - XOF</option>
      <option value="EUR">Euro - EUR</option>
      <option value="USD">Dollar - USD</option>
    </select>
  </div>

  <div class="section">
    <h3>3. Politique de Confidentialité</h3>
    <textarea id="politique" readonly></textarea>
  </div>

  <div class="section">
    <h3>4. Conditions Générales de Vente</h3>
    <textarea id="cgv" readonly></textarea>
    <div class="checkbox">
      <input type="checkbox" id="accepteCGV">
      <label for="accepteCGV">J'accepte les CGV</label>
    </div>
  </div>

  <button class="share-btn" onclick="partager()">→ Partager l'Application JAAY</button>
  <button onclick="sauvegarder()">Sauvegarder</button>
  <p id="msg" style="text-align:center; color:green; margin-top:10px; font-weight:bold;"></p>
</div>

<script>
const politiqueDefaut = `POLITIQUE DE CONFIDENTIALITÉ JAAY
1. Vos données sont stockées uniquement sur votre téléphone.
2. JAAY n'accède pas et ne vend pas vos informations.
3. Vos clients vous contactent directement via WhatsApp.`;

const cgvDefaut = `CONDITIONS GÉNÉRALES DE VENTE JAAY
1. Les prix sont en ${document.getElementById('devise')?.value || 'XOF'} et TTC.
2. Le paiement se fait selon la méthode choisie: Wave, OM ou Cash.
3. La livraison est à la charge du client sauf accord.
4. Les retours sont possibles sous 48h si le produit est défectueux.`;

function sauvegarder(){
  localStorage.setItem('jaay_langue', document.getElementById('langue').value);
  localStorage.setItem('jaay_devise', document.getElementById('devise').value);
  localStorage.setItem('jaay_politique', document.getElementById('politique').value);
  localStorage.setItem('jaay_cgv', document.getElementById('cgv').value);
  localStorage.setItem('jaay_accepteCGV', document.getElementById('accepteCGV').checked);
  
  document.getElementById('msg').innerText = '✅ Paramètres Sauvegardés !';
  setTimeout(()=>{document.getElementById('msg').innerText = ''}, 2000);
}

function partager(){
  const texte = "Découvre JAAY 🚀 Crée ta boutique WhatsApp en 2 minutes !";
  if(navigator.share){
    navigator.share({ title: 'JAAY', text: texte, url: window.location.origin });
  } else {
    navigator.clipboard.writeText(window.location.origin);
    alert('Lien copié ! Partage-le sur WhatsApp');
  }
}

// Charger les valeurs
document.getElementById('langue').value = localStorage.getItem('jaay_langue') || 'fr';
document.getElementById('devise').value = localStorage.getItem('jaay_devise') || 'XOF';
document.getElementById('politique').value = localStorage.getItem('jaay_politique') || politiqueDefaut;
document.getElementById('cgv').value = localStorage.getItem('jaay_cgv') || cgvDefaut;
document.getElementById('accepteCGV').checked = localStorage.getItem('jaay_accepteCGV') === 'true';
</script>
</body>
  </html>
